<rect x="220" y="112" width="190" height="132" rx="12" fill="#e9f7ef" stroke="#299764" stroke-width="2"/><text x="315" y="143" font-size="17" font-weight="700" fill="#17633f">Autoencoder</text><text x="315" y="171" font-size="15" fill="#17633f">72 → 128 → 32</text><text x="315" y="198" font-size="15" fill="#17633f">latent vector Z</text><text x="315" y="223" font-size="13" fill="#17633f">32 dimensions</text>
<path d="M410 179 H452" stroke="#5b6473" stroke-width="2.5" marker-end="url(#arr)"/>
