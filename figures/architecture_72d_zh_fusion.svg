<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<rect width="1200" height="430" fill="#ffffff"/><text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172033">Hybrid AE–GCN–RF Intrusion Detection</text>
