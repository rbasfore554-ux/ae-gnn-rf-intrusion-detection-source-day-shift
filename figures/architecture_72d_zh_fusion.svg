<path d="M1030 179 H1061" stroke="#5b6473" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1067" y="127" width="110" height="104" rx="12" fill="#e8f8f7" stroke="#198b83" stroke-width="2"/><text x="1122" y="162" font-size="16" font-weight="700" fill="#12645f">Random</text><text x="1122" y="184" font-size="16" font-weight="700" fill="#12645f">Forest</text><text x="1122" y="211" font-size="13" fill="#12645f">Benign/Attack</text>
<text x="600" y="314" font-size="17" fill="#263244">Threshold selected on validation data (F2 objective), then fixed for test evaluation</text><text x="600" y="350" font-size="14" fill="#596579">Reported test threshold: 0.4221336</text><text x="600" y="386" font-size="13" fill="#596579">Note: AE training in the reported experiment used the full training split, not only benign flows.</text>
